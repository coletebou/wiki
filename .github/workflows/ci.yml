# The four checks every change must pass before it reaches master (branch protection requires each by name).
name: ci

on:
  pull_request:
    # edited: a changed title or description is checked again, so it cannot ride on an earlier pass.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Pages (frontmatter, MDX, components, prices, wiki links, safety)
        run: npm run check:content
      - name: Build the site and its search index
        run: npm run build
      - name: MCP server, end to end over stdio
        run: npm --prefix mcp ci && npm --prefix mcp test

  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Every internal link and anchor in the built site
        run: npm run check:links

  public-safety:
    name: public-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Sources, pull request title and body, commit messages
        run: node scripts/safety-lint.mjs --pr
      - run: npm ci
      - run: npm run build
      - name: The built site, as it would be published
        run: node scripts/safety-lint.mjs --dist dist

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the history this change adds, then the tree
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            ./gitleaks git --redact --no-banner --log-opts="$BASE..$HEAD" .
          else
            ./gitleaks git --redact --no-banner .
          fi
          ./gitleaks dir --redact --no-banner .
